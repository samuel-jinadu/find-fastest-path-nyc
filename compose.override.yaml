x-airflow-common:
  &airflow-common
  environment:
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 60
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
    AIRFLOW__API_AUTH__JWT_SECRET: foo
    AIRFLOW__API__SECRET_KEY: bar
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: hCRoPUYBO27QiEg1MRu5hSjLG7yNd8y8XKlm-8kRlkQ=
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW_CONN_S3: aws://AKIAIOSFODNN7EXAMPLE:wJalrXUtnFEMI%2FK7MDENG%2FbPxRfiCYEXAMPLEKEY@/?endpoint_url=http%3A%2F%2Fminio%3A9000
    AIRFLOW_CONN_CITIBIKE: http://citibike:cycling@citibike_api:5000
    AIRFLOW_CONN_TAXI: http://taxi_fileserver
    AIRFLOW_CONN_RESULT_DB: postgresql://nyc:tr4N5p0RT4TI0N@result_db:5432/nyctransportation
    PYTHONPATH: /opt/airflow/nyctransport/src
  volumes:
    - ./src:/opt/airflow/nyctransport/src

services:
  airflow-apiserver:
    <<: *airflow-common

  airflow-dag-processor:
    <<: *airflow-common

  airflow-scheduler:
    <<: *airflow-common

  airflow-worker:
    <<: *airflow-common

  airflow-triggerer:
    <<: *airflow-common

  airflow-init:
    <<: *airflow-common

  airflow-cli:
    <<: *airflow-common

  taxi_fileserver:
    image: ghcr.io/samuel-jinadu/nyc-taxi_fileserver:latest
    environment:
      - POSTGRES_HOST=taxi_db
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=taxi
      - POSTGRES_PASSWORD=ridetlc
      - POSTGRES_DATABASE=tlctriprecords
      - DATA_YEAR=2023
    depends_on:
      taxi_db:
        condition: service_healthy
    ports:
      - "8081:80"

  taxi_db:
    image: ghcr.io/samuel-jinadu/nyc-taxi_db:latest
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d tlctriprecords"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  citibike_api:
    image: ghcr.io/samuel-jinadu/nyc-citibike_api:latest
    environment:
      - POSTGRES_HOST=citibike_db
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=citi
      - POSTGRES_PASSWORD=cycling
      - POSTGRES_DATABASE=citibike
      - DATA_YEAR=2023
    depends_on:
      citibike_db:
        condition: service_healthy
    ports:
      - "8082:5000"

  citibike_db:
    image: ghcr.io/samuel-jinadu/nyc-citibike_db:latest
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citi -d citibike"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    ports:
      - "9000:9000"
      - "9001:9001"
      - "35299:35299"
    environment:
      - MINIO_ROOT_USER=AKIAIOSFODNN7EXAMPLE
      - MINIO_ROOT_PASSWORD=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    command: "server --console-address :9001 /data"
    volumes:
      - locals3-data-volume:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio_init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 AKIAIOSFODNN7EXAMPLE wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY); do echo 'MinIO not up and running yet...' && sleep 1; done;
      echo 'MinIO is available.';
      /usr/bin/mc mb --ignore-existing minio/datalake;
      exit 0;
      "

  result_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=nyc
      - POSTGRES_PASSWORD=tr4N5p0RT4TI0N
      - POSTGRES_DB=nyctransportation
    volumes:
      - ./services/result_db/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - result-db-volume:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always

  nyc_transportation_api:
    image: ghcr.io/samuel-jinadu/nyc-nyc_transportation_api:latest
    environment:
      - POSTGRES_HOST=result_db
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=nyc
      - POSTGRES_PASSWORD=tr4N5p0RT4TI0N
      - POSTGRES_DATABASE=nyctransportation
    depends_on:
      result_db:
        condition: service_healthy
    ports:
      - "8083:5000"

volumes:
  locals3-data-volume:
  result-db-volume: